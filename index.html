<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>

    <link rel="stylesheet" href="style.css">
</head>
<body class="birthday-page">

    <!-- MUSIC -->
    <audio id="bgMusic" loop>
    <source src="birthday.mp3" type="audio/mpeg">
    </audio>

    <!-- STARS -->
    <div class="stars">
        <div class="star" style="top:10%;left:20%;"></div>
        <div class="star" style="top:30%;left:60%;"></div>
        <div class="star" style="top:70%;left:40%;"></div>
        <div class="star" style="top:50%;left:80%;"></div>
        <div class="star" style="top:20%;left:90%;"></div>
    </div>

    <!-- CONFETTI -->
    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>
    <div class="confetti c5"></div>
    <div class="confetti c6"></div>

    <!-- BALLOONS -->
    <div class="balloon blue1"></div>
    <div class="balloon blue2"></div>
    <div class="balloon blue3"></div>

    <!-- FIREWORKS -->
    <div class="firework f1"></div>
    <div class="firework f2"></div>
    <div class="firework f3"></div>

    <div class="container">

        <h1 class="title">Happy Birthday 💙</h1>

        <div class="cake">

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="layer layer3"></div>
            <div class="layer layer2"></div>
            <div class="layer layer1"></div>

        </div>

        <p class="subtitle">
            Live, Laugh, Love magkakajowa ka rin baks!
        </p>

        <a href="letter.html">
            <button class="btn">
                Open Your Letter
            </button>
        </a>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
