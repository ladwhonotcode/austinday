<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Letter</title>

    <link rel="stylesheet" href="style.css">
</head>
<body class="letter-page">

    <!-- STARS -->
    <div class="stars">
        <div class="star" style="top:5%;left:8%;"></div>
        <div class="star" style="top:10%;left:20%;"></div>
        <div class="star" style="top:14%;left:45%;"></div>
        <div class="star" style="top:18%;left:72%;"></div>
        <div class="star" style="top:22%;left:90%;"></div>

        <div class="star" style="top:30%;left:15%;"></div>
        <div class="star" style="top:34%;left:60%;"></div>
        <div class="star" style="top:40%;left:80%;"></div>

        <div class="star" style="top:48%;left:10%;"></div>
        <div class="star" style="top:52%;left:35%;"></div>
        <div class="star" style="top:58%;left:68%;"></div>

        <div class="star" style="top:65%;left:25%;"></div>
        <div class="star" style="top:70%;left:50%;"></div>
        <div class="star" style="top:74%;left:88%;"></div>

        <div class="star" style="top:82%;left:12%;"></div>
        <div class="star" style="top:88%;left:40%;"></div>
        <div class="star" style="top:92%;left:78%;"></div>
    </div>

    <div class="letter-container">

        <!-- Envelope -->
        <div class="envelope" onclick="openLetter()">

            <div class="top-flap"></div>

            <div class="letter page" id="letter">

                <h2>Happy Austin Day!💙</h2>

                <p id="typing-text"></p>

            </div>

        </div>

        <!-- Spotify -->
        <div class="spotify">

            <iframe style="border-radius:12px"
                src="https://open.spotify.com/embed/playlist/1UH9L8NmxbqvZhix2UiZxJ?utm_source=generator&theme=1"
                width="100%"
                height="352"
                frameBorder="0"
                allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
